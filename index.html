<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 مراجعة الاختبار التقييمي - الصف الثالث 🌟</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C63FF;
            --secondary: #FF6584;
            --success: #00C853;
            --warning: #FFD600;
            --info: #00B0FF;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-shadow: 0 20px 60px rgba(0,0,0,0.15);
            --btn-shadow: 0 8px 25px rgba(108, 99, 255, 0.4);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Bubbles */
        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }

        /* Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #FF6584, #6C63FF, #00C853, #FFD600);
            border-radius: 30px 30px 0 0;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Welcome Screen */
        .welcome-title {
            font-size: 2.5em;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            text-align: center;
            font-size: 1.3em;
            color: #666;
            margin-bottom: 30px;
        }

        .mascot {
            text-align: center;
            font-size: 5em;
            animation: bounce 2s infinite;
            margin: 20px 0;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Settings */
        .settings-group {
            margin: 20px 0;
        }

        .settings-label {
            font-size: 1.1em;
            font-weight: 700;
            color: #444;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-label .emoji {
            font-size: 1.3em;
        }

        .settings-select, .settings-input {
            width: 100%;
            padding: 15px 20px;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1.1em;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s;
            background: #f8f9fa;
            direction: rtl;
        }

        .settings-select:focus, .settings-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px 40px;
            border: none;
            border-radius: 20px;
            font-size: 1.3em;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6C63FF, #5a52d5);
            color: white;
            box-shadow: var(--btn-shadow);
            width: 100%;
            margin-top: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(108, 99, 255, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Quiz Screen */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            padding: 8px 15px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1.1em;
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #6C63FF, #FF6584);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .question-number {
            text-align: center;
            font-size: 0.95em;
            color: #888;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.8;
            padding: 20px;
            background: linear-gradient(135deg, #f0f0ff, #fff0f5);
            border-radius: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            padding: 20px 25px;
            border: 3px solid #e8e8e8;
            border-radius: 20px;
            background: white;
            font-size: 1.2em;
            font-weight: 600;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            text-align: right;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            border-color: var(--primary);
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(108, 99, 255, 0.15);
        }

        .option-btn.correct {
            border-color: var(--success);
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            animation: correctPulse 0.5s;
        }

        .option-btn.wrong {
            border-color: var(--secondary);
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            animation: shake 0.5s;
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Timer */
        .timer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .timer-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: 900;
            color: white;
            background: conic-gradient(var(--primary) var(--timer-progress, 100%), #e0e0e0 0%);
            position: relative;
        }

        .timer-circle::before {
            content: attr(data-time);
            position: absolute;
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .timer-warning {
            animation: timerPulse 0.5s infinite;
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Feedback */
        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .feedback-overlay.show {
            opacity: 1;
        }

        .feedback-message {
            font-size: 3em;
            font-weight: 900;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Hint */
        .hint-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 10px 20px;
            border: 2px solid #FFD600;
            border-radius: 15px;
            background: #FFFDE7;
            font-size: 1em;
            font-weight: 600;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .hint-btn:hover {
            background: #FFF9C4;
            transform: scale(1.05);
        }

        .hint-text {
            margin-top: 10px;
            padding: 15px;
            background: #FFFDE7;
            border-radius: 15px;
            border: 2px solid #FFD600;
            font-size: 1.05em;
            color: #555;
            display: none;
            animation: slideUp 0.3s;
        }

        .hint-text.show {
            display: block;
        }

        /* TTS Button */
        .tts-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 10px 20px;
            border: 2px solid var(--info);
            border-radius: 15px;
            background: #E1F5FE;
            font-size: 1em;
            font-weight: 600;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            margin-right: 10px;
        }

        .tts-btn:hover {
            background: #B3E5FC;
            transform: scale(1.05);
        }

        /* Results Screen */
        .results-card {
            text-align: center;
        }

        .results-score {
            font-size: 4em;
            font-weight: 900;
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        .results-stars {
            font-size: 3em;
            margin: 15px 0;
            animation: bounce 1.5s infinite;
        }

        .results-badge {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #FFD600, #FFA000);
            border-radius: 20px;
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin: 15px 0;
            box-shadow: 0 5px 20px rgba(255, 214, 0, 0.4);
        }

        .results-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 900;
            color: var(--primary);
        }

        .stat-label {
            font-size: 1em;
            color: #888;
            font-weight: 600;
        }

        .motivational-message {
            font-size: 1.4em;
            font-weight: 700;
            color: #555;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #f0f0ff, #fff0f5);
            border-radius: 15px;
        }

        /* Confetti */
        .confetti-piece {
            position: fixed;
            width: 12px;
            height: 12px;
            top: -20px;
            z-index: 9999;
            animation: confettiFall 3s linear forwards;
        }

        @keyframes confettiFall {
            0% { top: -20px; opacity: 1; transform: rotate(0deg); }
            100% { top: 110vh; opacity: 0; transform: rotate(720deg); }
        }

        /* Level Badge */
        .level-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 15px;
            background: linear-gradient(135deg, #E8EAF6, #C5CAE9);
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9em;
            color: #3F51B5;
        }

        /* Fun Fact */
        .fun-fact {
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
            border-radius: 15px;
            border: 2px solid #66BB6A;
            font-size: 1em;
            color: #2E7D32;
            display: none;
            animation: slideUp 0.3s;
        }

        .fun-fact.show {
            display: block;
        }

        /* Hidden sections */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 25px 20px;
                border-radius: 25px;
            }
            .welcome-title {
                font-size: 1.8em;
            }
            .question-text {
                font-size: 1.2em;
                padding: 15px;
            }
            .option-btn {
                padding: 15px 18px;
                font-size: 1.05em;
            }
            .btn {
                padding: 15px 30px;
                font-size: 1.1em;
            }
            .quiz-header {
                flex-direction: column;
                align-items: stretch;
            }
            .score-display {
                justify-content: center;
            }
        }

        /* Stars animation */
        .star-burst {
            position: fixed;
            font-size: 2em;
            z-index: 9999;
            pointer-events: none;
            animation: starBurst 1s ease-out forwards;
        }

        @keyframes starBurst {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.5) rotate(180deg); opacity: 1; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }

        /* Coins animation */
        .coin-anim {
            position: fixed;
            font-size: 1.5em;
            z-index: 9999;
            pointer-events: none;
            animation: coinFloat 1s ease-out forwards;
        }

        @keyframes coinFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(0.5); opacity: 0; }
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }

        .difficulty-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .diff-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 15px;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            background: white;
            font-size: 1em;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .diff-btn.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, #EDE7F6, #D1C4E9);
            color: var(--primary);
        }

        .diff-btn:hover {
            transform: scale(1.05);
        }

        .action-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bubbles" id="bubbles"></div>

    <!-- Feedback Overlay -->
    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-message" id="feedbackMessage"></div>
    </div>

    <div class="container">
        <!-- Welcome / Settings Screen -->
        <div class="card screen active" id="welcomeScreen">
            <div class="mascot">🦉</div>
            <h1 class="welcome-title">مراجعة الاختبار التقييمي</h1>
            <p class="welcome-subtitle">الصف الثالث - الفصل الأول 🎓</p>
            <p style="text-align:center; color:#888; margin-bottom:20px; font-size:1.05em;">
                هيا بنا نراجع دروسنا بطريقة ممتعة! 🎮✨
            </p>

            <div class="settings-grid">
                <div class="settings-group">
                    <label class="settings-label"><span class="emoji">⏱️</span> مؤقت السؤال (ثواني)</label>
                    <select class="settings-select" id="questionTimer">
                        <option value="15">15 ثانية</option>
                        <option value="20" selected>20 ثانية</option>
                        <option value="30">30 ثانية</option>
                        <option value="45">45 ثانية</option>
                        <option value="0">بدون مؤقت</option>
                    </select>
                </div>

                <div class="settings-group">
                    <label class="settings-label"><span class="emoji">📝</span> عدد الأسئلة</label>
                    <select class="settings-select" id="questionCount">
                        <option value="5">5 أسئلة</option>
                        <option value="10" selected>10 أسئلة</option>
                        <option value="15">15 سؤال</option>
                        <option value="20">20 سؤال (الكل)</option>
                    </select>
                </div>
            </div>

            <div class="settings-group">
                <label class="settings-label"><span class="emoji">🎯</span> مستوى الصعوبة</label>
                <div class="difficulty-btns">
                    <button class="diff-btn active" data-level="easy" onclick="setDifficulty('easy', this)">😊 سهل</button>
                    <button class="diff-btn" data-level="medium" onclick="setDifficulty('medium', this)">🤔 متوسط</button>
                    <button class="diff-btn" data-level="hard" onclick="setDifficulty('hard', this)">💪 صعب</button>
                </div>
            </div>

            <button class="btn btn-primary" onclick="startQuiz()">
                🚀 ابدأ المراجعة!
            </button>
        </div>

        <!-- Quiz Screen -->
        <div class="card screen" id="quizScreen">
            <div class="quiz-header">
                <div class="score-display">
                    <div class="score-item">⭐ <span id="starsCount">0</span></div>
                    <div class="score-item">🪙 <span id="coinsCount">0</span></div>
                </div>
                <div class="level-badge">📊 المستوى <span id="levelDisplay">1</span></div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
            </div>

            <div class="question-number" id="questionNumber"></div>

            <div class="timer-container" id="timerContainer">
                <div class="timer-circle" id="timerCircle" data-time="20"></div>
            </div>

            <div class="question-text" id="questionText"></div>

            <div class="options-grid" id="optionsGrid"></div>

            <div class="action-btns">
                <button class="tts-btn" onclick="readQuestion()">🔊 اقرأ لي السؤال</button>
                <button class="hint-btn" onclick="showHint()">💡 تلميح</button>
            </div>

            <div class="hint-text" id="hintText"></div>
            <div class="fun-fact" id="funFact"></div>
        </div>

        <!-- Results Screen -->
        <div class="card screen results-card" id="resultsScreen">
            <div class="mascot">🏆</div>
            <h2 style="font-size:1.8em; color:#333; margin-bottom:10px;">أحسنت! انتهت المراجعة 🎉</h2>
            
            <div class="results-score" id="finalScore">0%</div>
            <div class="results-stars" id="finalStars"></div>
            <div class="results-badge" id="finalBadge"></div>

            <div class="results-stats">
                <div class="stat-item">
                    <div class="stat-number" id="correctCount">0</div>
                    <div class="stat-label">✅ صحيحة</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="wrongCount">0</div>
                    <div class="stat-label">❌ خاطئة</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalCoins">0</div>
                    <div class="stat-label">🪙 عملات</div>
                </div>
            </div>

            <div class="motivational-message" id="motivationalMsg"></div>

            <button class="btn btn-primary" onclick="restartQuiz()">
                🔄 العب مرة أخرى!
            </button>
        </div>
    </div>

    <script>
        // ============ QUESTIONS DATABASE ============
        const allQuestions = [
            // Lesson 1: أخبرني عن الإسلام
            {
                question: "جلسة الرجل أمام الرسول ﷺ (أسند ركبتيه إلى ركبتيه) تدل على:",
                options: ["الحرص والاهتمام", "السرعة والاستعجال", "التباعد والفراق", "النوم والكسل"],
                correct: 0,
                hint: "فكّر: لماذا يقترب الشخص من المعلم؟ 🤔",
                funFact: "كان جبريل عليه السلام يأتي النبي ﷺ بصورة رجل ليعلّم الصحابة! 📚",
                difficulty: "easy",
                category: "إسلامية"
            },
            {
                question: "جاء ردّ الرسول ﷺ على الرجل مُعلِّماً لـِ:",
                options: ["المسلمين جميعاً", "السائل وحده", "الصحابة الحاضرين", "أهل المدينة فقط"],
                correct: 0,
                hint: "الرسول ﷺ أراد أن يستفيد الجميع من الإجابة 🌍",
                funFact: "هذا الحديث يُسمى 'حديث جبريل' وهو من أهم الأحاديث في الإسلام! ⭐",
                difficulty: "easy",
                category: "إسلامية"

        // ============ SOUND EFFECTS (Web Audio API) ============
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'correct':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.4);
                    break;
                case 'wrong':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'tick':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.05);
                    break;
                case 'celebration':
                    const notes = [523, 587, 659, 698, 784, 880, 988, 1047];
                    notes.forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.type = 'sine';
                        o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.15);
                        o.start(audioCtx.currentTime + i * 0.1);
                        o.stop(audioCtx.currentTime + i * 0.1 + 0.15);
                    });
                    break;
                case 'warning':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.1);
                    break;
            }
        }

        // ============ START QUIZ ============
        function startQuiz() {
            initAudio();
            const questionTime = parseInt(document.getElementById('questionTimer').value);
            const questionCount = parseInt(document.getElementById('questionCount').value);

            // Filter questions by difficulty
            let filtered = allQuestions;
            if (gameState.difficulty === 'easy') {
                filtered = allQuestions.filter(q => q.difficulty === 'easy');
            } else if (gameState.difficulty === 'medium') {
                filtered = allQuestions.filter(q => q.difficulty === 'easy' || q.difficulty === 'medium');
            }
            // Hard = all questions

            // If not enough filtered, use all
            if (filtered.length < questionCount) {
                filtered = allQuestions;
            }

            // Shuffle and pick
            const shuffled = [...filtered].sort(() => Math.random() - 0.5);
            gameState.questions = shuffled.slice(0, Math.min(questionCount, shuffled.length));
            gameState.questionTime = questionTime;
            gameState.currentQuestion = 0;
            gameState.score = 0;
            gameState.stars = 0;
            gameState.coins = 0;
            gameState.level = 1;
            gameState.correct = 0;
            gameState.wrong = 0;

            showScreen('quizScreen');
            loadQuestion();
        }

        // ============ LOAD QUESTION ============
        function loadQuestion() {
            if (gameState.currentQuestion >= gameState.questions.length) {
                showResults();
                return;
            }

            gameState.answered = false;
            gameState.hintUsed = false;
            const q = gameState.questions[gameState.currentQuestion];
            const total = gameState.questions.length;
            const current = gameState.currentQuestion + 1;

            // Update UI
            document.getElementById('questionNumber').textContent = `السؤال ${current} من ${total}`;
            document.getElementById('progressBar').style.width = ((current - 1) / total * 100) + '%';
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('starsCount').textContent = gameState.stars;
            document.getElementById('coinsCount').textContent = gameState.coins;
            document.getElementById('levelDisplay').textContent = gameState.level;
            document.getElementById('hintText').classList.remove('show');
            document.getElementById('hintText').textContent = '';
            document.getElementById('funFact').classList.remove('show');

            // Shuffle options
            const optionIndices = [0, 1, 2, 3];
            for (let i = optionIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionIndices[i], optionIndices[j]] = [optionIndices[j], optionIndices[i]];
            }

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';

            const optionEmojis = ['🔵', '🟢', '🟡', '🟣'];
            optionIndices.forEach((optIdx, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${optionEmojis[i]} ${q.options[optIdx]}`;
                btn.dataset.index = optIdx;
                btn.onclick = function(e) { selectAnswer(optIdx, this, e); };
                grid.appendChild(btn);
            });

            // Start timer
            startTimer();
        }

        // ============ TIMER ============
        function startTimer() {
            clearInterval(gameState.timerInterval);
            const timerContainer = document.getElementById('timerContainer');
            const timerCircle = document.getElementById('timerCircle');

            if (gameState.questionTime === 0) {
                timerContainer.style.display = 'none';
                return;
            }

            timerContainer.style.display = 'flex';
            gameState.timeLeft = gameState.questionTime;
            timerCircle.setAttribute('data-time', gameState.timeLeft);
            timerCircle.style.setProperty('--timer-progress', '100%');
            timerCircle.classList.remove('timer-warning');

            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                timerCircle.setAttribute('data-time', gameState.timeLeft);
                const progress = (gameState.timeLeft / gameState.questionTime) * 100;
                timerCircle.style.setProperty('--timer-progress', progress + '%');

                if (gameState.timeLeft <= 5 && gameState.timeLeft > 0) {
                    timerCircle.classList.add('timer-warning');
                    playSound('warning');
                }

                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timerInterval);
                    if (!gameState.answered) {
                        timeUp();
                    }
                }
            }, 1000);
        }

        function timeUp() {
            gameState.answered = true;
            gameState.wrong++;
            
            // Highlight correct answer
            const q = gameState.questions[gameState.currentQuestion];
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.add('disabled');
                if (parseInt(btn.dataset.index) === q.correct) {
                    btn.classList.add('correct');
                }
            });

            showFeedback('⏰ انتهى الوقت!', '#FF9800');
            playSound('wrong');

            setTimeout(() => {
                gameState.currentQuestion++;
                loadQuestion();
            }, 2000);
        }

        // ============ SELECT ANSWER ============
        function selectAnswer(selectedIdx, btn, event) {
            if (gameState.answered) return;
            gameState.answered = true;
            clearInterval(gameState.timerInterval);

            const q = gameState.questions[gameState.currentQuestion];
            const isCorrect = selectedIdx === q.correct;

            // Disable all buttons
            document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled'));

            if (isCorrect) {
                btn.classList.add('correct');
                gameState.correct++;
                gameState.stars++;
                gameState.coins += gameState.hintUsed ? 5 : 10;
                
                // Level up every 3 correct
                if (gameState.correct % 3 === 0) {
                    gameState.level++;
                }

                playSound('correct');
                createConfetti(20);
                createStarBurst(event.clientX, event.clientY);
                createCoinAnim(event.clientX, event.clientY - 50);

                const messages = ['أحسنت! 🌟', 'ممتاز! 🎉', 'رائع! 🏆', 'عبقري! 🧠', 'مذهل! ✨', 'بطل! 💪'];
                showFeedback(messages[Math.floor(Math.random() * messages.length)], '#00C853');
            } else {
                btn.classList.add('wrong');
                gameState.wrong++;
                
                // Show correct answer
                document.querySelectorAll('.option-btn').forEach(b => {
                    if (parseInt(b.dataset.index) === q.correct) {
                        b.classList.add('correct');
                    }
                });

                playSound('wrong');
                const messages = ['لا بأس! حاول مرة أخرى 💪', 'قريب! المرة القادمة إن شاء الله 🌈', 'لا تقلق! أنت تتعلم 📚'];
                showFeedback(messages[Math.floor(Math.random() * messages.length)], '#FF6584');
            }

            // Show fun fact
            const funFactEl = document.getElementById('funFact');
            funFactEl.textContent = '💡 ' + q.funFact;
            funFactEl.classList.add('show');

            // Update score display
            document.getElementById('starsCount').textContent = gameState.stars;
            document.getElementById('coinsCount').textContent = gameState.coins;
            document.getElementById('levelDisplay').textContent = gameState.level;

            // Next question after delay
            setTimeout(() => {
                gameState.currentQuestion++;
                loadQuestion();
            }, 2500);
        }

        function readQuestion() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const q = gameState.questions[gameState.currentQuestion];
                const utterance = new SpeechSynthesisUtterance(q.question);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.8;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        // ============ RESULTS ============
        function showResults() {
            clearInterval(gameState.timerInterval);
            playSound('celebration');
            createConfetti(100);

            const total = gameState.questions.length;
            const percentage = Math.round((gameState.correct / total) * 100);

            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('correctCount').textContent = gameState.correct;
            document.getElementById('wrongCount').textContent = gameState.wrong;
            document.getElementById('totalCoins').textContent = gameState.coins;

            // Stars display
            let starsHTML = '';
            const starCount = Math.ceil((percentage / 100) * 5);
            for (let i = 0; i < 5; i++) {
                starsHTML += i < starCount ? '⭐' : '☆';
            }
            document.getElementById('finalStars').textContent = starsHTML;

            // Badge
            let badge = '';
            if (percentage >= 90) badge = '🏆 بطل المراجعة!';
            else if (percentage >= 70) badge = '🥇 ممتاز!';
            else if (percentage >= 50) badge = '🥈 جيد جداً!';
            else if (percentage >= 30) badge = '🥉 جيد - واصل التعلم!';
            else badge = '📚 تحتاج مراجعة أكثر!';
            document.getElementById('finalBadge').textContent = badge;

            // Motivational message
            let msg = '';
            if (percentage >= 90) msg = '🌟 ما شاء الله! أنت نجم لامع! استمر في التفوق والاجتهاد! 🚀';
            else if (percentage >= 70) msg = '💪 أداء رائع! أنت قريب جداً من الامتياز! واصل المذاكرة! 📖';
            else if (percentage >= 50) msg = '🌈 عمل جيد! مع مزيد من المراجعة ستصل للقمة! 🎯';
            else msg = '📚 لا تقلق! كل محاولة تجعلك أقوى! راجع الدرس وحاول مرة أخرى! 💪';
            document.getElementById('motivationalMsg').textContent = msg;

            showScreen('resultsScreen');

            // Celebration confetti waves
            setTimeout(() => createConfetti(50), 1000);
            setTimeout(() => createConfetti(30), 2000);
        }

        // ============ RESTART ============
        function restartQuiz() {
            showScreen('welcomeScreen');
        }

        // ============ INIT ============
        createBubbles();
    </script>
</body>
</html>
