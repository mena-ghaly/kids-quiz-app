<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🇫🇷 Quiz Français – Classe 3</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #1a73e8;
      --green:  #2ecc40;
      --red:    #ff4136;
      --yellow: #ffdc00;
      --orange: #ff851b;
      --purple: #b10dc9;
      --pink:   #f012be;
      --bg:     #f0f4ff;
      --white:  #ffffff;
      --text:   #222;
      --radius: 18px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    /* ===== CONTAINER ===== */
    .app {
      background: var(--white);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      width: 100%;
      max-width: 680px;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: white;
      padding: 18px 24px 14px;
      text-align: center;
    }
    .header h1 { font-size: clamp(1.3rem, 5vw, 1.8rem); letter-spacing: 1px; }
    .header p  { font-size: 0.9rem; opacity: .85; margin-top: 4px; }

    /* ===== PROGRESS BAR ===== */
    .progress-wrap {
      padding: 14px 24px 0;
      background: #f7f9ff;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .progress-bar-bg {
      height: 12px;
      background: #e0e6ff;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 99px;
      transition: width .5s ease;
    }

    /* ===== TIMER ===== */
    .timer-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 10px 24px 6px;
      background: #f7f9ff;
    }
    .timer-circle {
      position: relative;
      width: 56px;
      height: 56px;
    }
    .timer-circle svg {
      position: absolute;
      top: 0; left: 0;
      transform: rotate(-90deg);
    }
    .timer-circle .timer-num {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      font-size: 1.1rem;
      font-weight: 800;
      color: #764ba2;
    }
    .timer-urgent { color: var(--red) !important; animation: pulse 0.5s infinite alternate; }
    @keyframes pulse { from { transform: translate(-50%,-50%) scale(1); } to { transform: translate(-50%,-50%) scale(1.15); } }

    /* ===== MAIN AREA ===== */
    .main {
      padding: 20px 24px 28px;
      background: #f7f9ff;
    }

    /* ===== CATEGORY BADGE ===== */
    .category-badge {
      display: inline-block;
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 10px;
    }

    /* ===== QUESTION ===== */
    .question-box {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 16px rgba(102,126,234,.12);
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .question-text {
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
      font-weight: 700;
      color: var(--text);
      text-align: center;
      line-height: 1.45;
    }

    /* ===== OPTIONS GRID ===== */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 420px) { .options-grid { grid-template-columns: 1fr; } }

    .option-btn {
      background: white;
      border: 3px solid #dde3ff;
      border-radius: var(--radius);
      padding: 16px 14px;
      font-size: clamp(0.95rem, 3vw, 1.08rem);
      font-weight: 700;
      color: #333;
      cursor: pointer;
      text-align: center;
      transition: transform .12s, border-color .15s, background .15s, box-shadow .15s;
      line-height: 1.3;
      box-shadow: 0 3px 10px rgba(0,0,0,.07);
      position: relative;
      overflow: hidden;
    }
    .option-btn:hover:not(:disabled) {
      border-color: #667eea;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(102,126,234,.22);
    }
    .option-btn:active:not(:disabled) { transform: translateY(0); }
    .option-btn:disabled { cursor: not-allowed; }

    /* label letters A B C D */
    .option-btn::before {
      content: attr(data-label);
      display: inline-block;
      background: #e8ecff;
      color: #667eea;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      line-height: 26px;
      text-align: center;
      font-size: 0.8rem;
      margin-right: 8px;
      font-weight: 800;
      flex-shrink: 0;
      transition: background .15s, color .15s;
    }
    .option-btn { display: flex; align-items: center; }

    /* correct / wrong states */
    .option-btn.correct {
      background: #e6ffed;
      border-color: var(--green);
      color: #1a7a30;
    }
    .option-btn.correct::before { background: var(--green); color: white; }

    .option-btn.wrong {
      background: #fff0f0;
      border-color: var(--red);
      color: #8b0000;
      animation: shake 0.4s ease;
    }
    .option-btn.wrong::before { background: var(--red); color: white; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }

    /* ===== FEEDBACK BANNER ===== */
    .feedback {
      border-radius: var(--radius);
      padding: 12px 18px;
      margin-top: 14px;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      display: none;
      animation: fadeIn .2s ease;
    }
    .feedback.show { display: block; }
    .feedback.correct-fb { background: #e6ffed; color: #1a7a30; border: 2px solid #2ecc40; }
    .feedback.wrong-fb   { background: #fff0f0; color: #8b0000; border: 2px solid #ff4136; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }

    /* ===== NEXT BUTTON ===== */
    .next-btn {
      display: none;
      margin: 16px auto 0;
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 99px;
      padding: 14px 42px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: .5px;
      box-shadow: 0 6px 20px rgba(102,126,234,.35);
      transition: transform .15s, box-shadow .15s;
    }
    .next-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(102,126,234,.45); }
    .next-btn.visible { display: block; }

    /* ===== SCORE PILL ===== */
    .score-pill {
      display: flex;
      justify-content: center;
      gap: 18px;
      padding: 10px 24px 0;
      background: #f7f9ff;
    }
    .pill {
      background: white;
      border-radius: 99px;
      padding: 6px 18px;
      font-size: 0.88rem;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill.correct-pill { color: #1a7a30; }
    .pill.wrong-pill   { color: #8b0000; }

    /* ===== START SCREEN ===== */
    #start-screen {
      padding: 40px 24px;
      text-align: center;
      background: #f7f9ff;
    }
    #start-screen .big-emoji { font-size: 5rem; margin-bottom: 10px; }
    #start-screen h2 { font-size: 1.6rem; color: #764ba2; margin-bottom: 8px; }
    #start-screen p  { color: #555; font-size: 1rem; margin-bottom: 24px; line-height: 1.5; }
    .start-btn {
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 99px;
      padding: 16px 52px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(102,126,234,.4);
      transition: transform .15s;
    }
    .start-btn:hover { transform: scale(1.04); }

    /* ===== END SCREEN ===== */
    #end-screen {
      display: none;
      padding: 36px 24px 40px;
      text-align: center;
      background: #f7f9ff;
    }
    .stars { font-size: 3rem; letter-spacing: 6px; margin: 12px 0; }
    #end-screen h2 { font-size: 1.7rem; color: #764ba2; margin-bottom: 6px; }
    .final-score-num { font-size: 3.5rem; font-weight: 900; color: #667eea; margin: 8px 0; }
    #end-screen p { color: #555; font-size: 1rem; margin-bottom: 20px; }
    .restart-btn {
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 99px;
      padding: 14px 44px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(102,126,234,.35);
      transition: transform .15s;
    }
    .restart-btn:hover { transform: scale(1.04); }

    /* ===== QUIZ AREA (hidden until started) ===== */
    #quiz-area { display: none; }

    /* ===== CONFETTI canvas ===== */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="app">
  <!-- HEADER -->
  <div class="header">
    <h1>🇫🇷 Quiz Français – Classe 3</h1>
    <p>Révisions amusantes pour les enfants !</p>
  </div>

  <!-- START SCREEN -->
  <div id="start-screen">
    <div class="big-emoji">🎓</div>
    <h2>Prêt(e) à jouer ?</h2>
    <p>Tu vas répondre à <strong id="total-q-count"></strong> questions sur le français.<br>Tu as <strong>15 secondes</strong> par question. Bonne chance ! 🍀</p>
    <button class="start-btn" onclick="startQuiz()">▶ Commencer le Quiz !</button>
  </div>

  <!-- QUIZ AREA -->
  <div id="quiz-area">
    <!-- Score pills -->
    <div class="score-pill">
      <div class="pill correct-pill">✅ <span id="score-correct">0</span> correctes</div>
      <div class="pill wrong-pill">❌ <span id="score-wrong">0</span> fausses</div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-meta">
        <span>Question <span id="q-num">1</span> / <span id="q-total"></span></span>
        <span id="q-category"></span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- Timer -->
    <div class="timer-row">
      <div class="timer-circle">
        <svg width="56" height="56" viewBox="0 0 56 56">

          <circle id="timer-ring" cx="28" cy="28" r="24" fill="none" stroke="#764ba2" stroke-width="5"
            stroke-dasharray="150.8" stroke-dashoffset="0" stroke-linecap="round"
            style="transition: stroke-dashoffset .95s linear, stroke .5s;"/>
        </svg>
        <div class="timer-num" id="timer-num">15</div>
      </div>
    </div>

    <!-- Main question area -->
    <div class="main">
      <div class="category-badge" id="cat-badge">Catégorie</div>
      <div class="question-box">
        <div class="question-text" id="question-text">Question ici</div>
      </div>

      <div class="options-grid" id="options-grid"></div>

      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Suivant ➡</button>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="end-screen">
    <div class="big-emoji" id="end-emoji">🏆</div>
    <h2 id="end-title">Bravo !</h2>
    <div class="stars" id="end-stars"></div>
    <div class="final-score-num" id="final-score-text"></div>
    <p id="end-message"></p>
    <button class="restart-btn" onclick="restartQuiz()">🔄 Rejouer !</button>
  </div>
</div>

/* =====================================================================
   AUDIO (Web Audio API — no library needed)
   ===================================================================== */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, type, duration, gainVal = 0.3) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(gainVal, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}
function playCorrectSound() {
  playTone(523, 'sine', 0.15);
  setTimeout(() => playTone(659, 'sine', 0.15), 120);
  setTimeout(() => playTone(784, 'sine', 0.25), 240);
}
function playWrongSound() {
  playTone(220, 'sawtooth', 0.15, 0.2);
  setTimeout(() => playTone(180, 'sawtooth', 0.2, 0.2), 150);
}
function playTickSound() {
  playTone(880, 'sine', 0.05, 0.05);
}

/* =====================================================================
   CONFETTI
   ===================================================================== */
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#667eea','#764ba2','#ffdc00','#ff851b','#2ecc40','#ff4136','#f012be'];
  const pieces = Array.from({length: 160}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: Math.random() * 10 + 6,
    h: Math.random() * 6 + 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    speed: Math.random() * 4 + 2,
    angle: Math.random() * 360,
    spin: (Math.random() - 0.5) * 6
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.angle * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
      p.y += p.speed;
      p.angle += p.spin;
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
    });
    frame++;
    if (frame < 180) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

/* =====================================================================
   SHUFFLE
   ===================================================================== */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =====================================================================
   INIT
   ===================================================================== */
document.getElementById('total-q-count').textContent = ALL_QUESTIONS.length;

function startQuiz() {
  questions = shuffle(ALL_QUESTIONS);
  currentIndex = 0;
  score = 0;
  wrongCount = 0;
  document.getElementById('score-correct').textContent = 0;
  document.getElementById('score-wrong').textContent = 0;
  document.getElementById('q-total').textContent = questions.length;

  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';

  loadQuestion();
}

/* =====================================================================
   LOAD QUESTION
   ===================================================================== */
function loadQuestion() {
  answered = false;
  const q = questions[currentIndex];

  // Progress
  document.getElementById('q-num').textContent = currentIndex + 1;
  const pct = (currentIndex / questions.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';

  // Category
  document.getElementById('cat-badge').textContent = q.category;
  document.getElementById('q-category').textContent = q.category;

  // Question text
  document.getElementById('question-text').textContent = q.question;

  // Options
  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  // Shuffle options display order
  const idxOrder = shuffle([0,1,2,3]);
  idxOrder.forEach((optIdx, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.setAttribute('data-label', labels[i]);
    btn.setAttribute('data-value', q.options[optIdx]);
    btn.textContent = q.options[optIdx];
    btn.onclick = () => selectAnswer(btn, q);
    grid.appendChild(btn);
  });

  // Feedback hidden
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';

  // Next btn hidden
  document.getElementById('next-btn').classList.remove('visible');

  // Start timer
  startTimer();
}

/* =====================================================================
   TIMER
   ===================================================================== */
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = TIMER_SECS;
  updateTimerUI();

  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 5 && timeLeft > 0) playTickSound();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      handleTimeout();
    }
  }, 1000);
}

function updateTimerUI() {
  const numEl = document.getElementById('timer-num');
  const ring  = document.getElementById('timer-ring');
  numEl.textContent = timeLeft;
  const offset = CIRCUMFERENCE * (1 - timeLeft / TIMER_SECS);
  ring.style.strokeDashoffset = offset;

  if (timeLeft <= 5) {
    numEl.classList.add('timer-urgent');
    ring.style.stroke = '#ff4136';
  } else {
    numEl.classList.remove('timer-urgent');
    ring.style.stroke = '#764ba2';
  }
}

function handleTimeout() {
  if (answered) return;
  answered = true;
  playWrongSound();
  wrongCount++;
  document.getElementById('score-wrong').textContent = wrongCount;

  // Highlight correct answer
  const q = questions[currentIndex];
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.getAttribute('data-value') === q.answer) btn.classList.add('correct');
  });

  showFeedback(false, `⏰ Temps écoulé ! La bonne réponse était : « ${q.answer} » — ${q.explanation}`);
  document.getElementById('next-btn').classList.add('visible');
}

/* =====================================================================
   SELECT ANSWER
   ===================================================================== */
function selectAnswer(btn, q) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const selected = btn.getAttribute('data-value');
  const correct  = selected === q.answer;

  // Disable all buttons and mark
  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (b.getAttribute('data-value') === q.answer) b.classList.add('correct');
  });
  if (!correct) btn.classList.add('wrong');

  if (correct) {
    score++;
    document.getElementById('score-correct').textContent = score;
    playCorrectSound();
    showFeedback(true, `🎉 Bravo ! ${q.explanation}`);
  } else {
    wrongCount++;
    document.getElementById('score-wrong').textContent = wrongCount;
    playWrongSound();
    showFeedback(false, `😔 Pas tout à fait ! La bonne réponse est « ${q.answer} ». ${q.explanation}`);
  }

  document.getElementById('next-btn').classList.add('visible');
}

/* =====================================================================
   FEEDBACK
   ===================================================================== */
function showFeedback(correct, text) {
  const fb = document.getElementById('feedback');
  fb.textContent = text;
  fb.className = 'feedback show ' + (correct ? 'correct-fb' : 'wrong-fb');
}

/* =====================================================================
   NEXT
   ===================================================================== */
function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showEndScreen();
  } else {
    loadQuestion();
  }
}

/* =====================================================================
   END SCREEN
   ===================================================================== */
function showEndScreen() {
  clearInterval(timerInterval);
  document.getElementById('quiz-area').style.display = 'none';
  const endEl = document.getElementById('end-screen');
  endEl.style.display = 'block';

  const total = questions.length;
  const pct   = score / total;

  // Stars
  let stars = '';
  if (pct >= 0.9)      stars = '⭐⭐⭐⭐⭐';
  else if (pct >= 0.7) stars = '⭐⭐⭐⭐';
  else if (pct >= 0.5) stars = '⭐⭐⭐';
  else if (pct >= 0.3) stars = '⭐⭐';
  else                 stars = '⭐';

  // Emoji + title + message
  let emoji, title, msg;
  if (pct >= 0.9) {
    emoji = '🏆'; title = 'Incroyable !';
    msg = `Tu es une vraie star du français ! ${score} bonnes réponses sur ${total}. Félicitations ! 🥳`;
    launchConfetti();
  } else if (pct >= 0.7) {
    emoji = '🌟'; title = 'Excellent !';
    msg = `Très bien joué ! ${score} bonnes réponses sur ${total}. Continue comme ça ! 😊`;
    launchConfetti();
  } else if (pct >= 0.5) {
    emoji = '👍'; title = 'Bien joué !';
    msg = `${score} bonnes réponses sur ${total}. Tu progresses ! Entraîne-toi encore un peu. 💪`;
  } else if (pct >= 0.3) {
    emoji = '📚'; title = 'Continue d\'apprendre !';
    msg = `${score} bonnes réponses sur ${total}. Relis tes notes et réessaie — tu peux le faire ! 📖`;
  } else {
    emoji = '💪'; title = 'Courage !';
    msg = `${score} bonnes réponses sur ${total}. Ne t'inquiète pas — avec de la pratique, tu vas t'améliorer ! 🌈`;
  }

  document.getElementById('end-emoji').textContent = emoji;
  document.getElementById('end-title').textContent = title;
  document.getElementById('end-stars').textContent = stars;
  document.getElementById('final-score-text').textContent = `${score} / ${total}`;
  document.getElementById('end-message').textContent = msg;
}

/* =====================================================================
   RESTART
   ===================================================================== */
function restartQuiz() {
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'block';
}
</script>
